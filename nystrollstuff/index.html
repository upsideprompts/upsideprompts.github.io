<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Stroll Stuff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764BA2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .card h3 {
            color: #444;
            margin-bottom: 8px;
        }
        .card p {
            color: #666;
            margin: 5px 0;
        }
        .card a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .baseball-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .hiking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .refresh-info {
            text-align: center;
            color: #666;
            font-style: italic;
            margin-top: 20px;
        }
        .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚾🥾 NY Stroll Stuff</h1>
            <p>Baseball & Hiking in New York</p>
        </header>

        <section class="section">
            <h2>⚾ Baseball Events</h2>
            <div class="baseball-grid" id="baseball-container">
                <!-- Baseball entries will be loaded here -->
            </div>
        </section>

        <section class="section">
            <h2>🥾 Hiking Events (NYC Area)</h2>
            <div class="hiking-grid" id="hiking-container">
                <!-- Hiking events will be loaded here -->
            </div>
        </section>

        <p class="refresh-info">Last updated: <span id="last-update">Loading...</span></p>
    </div>
    

<script>
        // October 22-23, 2026 Baseball Games - Updated
        const baseballData = [
        {
                "teams": "New York Yankees vs Tampa Bay Rays",
                "stadium": "Yankee Stadium, New York",
                "day": "Friday, October 22, 2026",
                "time": "1:10 PM EDT",
                "price": "$85-135",
                "link": "https://www.mlb.com/yankees/schedule/2026/10/22"
        },
        {
                "teams": "New York Mets vs Atlanta Braves",
                "stadium": "Citi Field, New York",
                "day": "Friday, October 22, 2026",
                "time": "7:05 PM EDT",
                "price": "$75-120",
                "link": "https://www.mlb.com/mets/schedule/2026/10/22"
        },
        {
                "teams": "Boston Red Sox vs New York Yankees",
                "stadium": "Yankee Stadium, New York",
                "day": "Saturday, October 23, 2026",
                "time": "1:10 PM EDT",
                "price": "$90-140",
                "link": "https://www.mlb.com/yankees/schedule/2026/10/23"
        },
        {
                "teams": "Los Angeles Dodgers vs San Francisco Giants",
                "stadium": "Oracle Park, San Francisco",
                "day": "Saturday, October 23, 2026",
                "time": "4:05 PM EDT",
                "price": "$80-130",
                "link": "https://www.mlb.com/giants/schedule/2026/10/23"
        }
];

        // October 22-24, 2026 NYC hiking opportunities (including additional events from Meetup.com)
        const hikingData = [
        {
                "title": "Crimson & Gold: A Fall Walk in Central Park",
                "location": "Central Park, Manhattan",
                "time": "Saturday, October 24, 2026 - 2:00 PM EDT",
                "difficulty": "Easy-Moderate (~3 miles)",
                "link": "https://www.meetup.com/nycfoodiesclub/events/316738846/"
        },
        {
                "title": "The Wilds of Manhattan: Fort Tryon & Inwood Hill Parks + Local Neighborhoods",
                "location": "Fort Tryon & Inwood Hill Parks",
                "time": "Saturday, October 24, 2026 - 10:30 AM EDT",
                "difficulty": "Moderate (~4 miles)",
                "link": "https://www.meetup.com/exploring-nyc-history-and-neighborhoods/events/316283309/"
        },
        {
                "title": "Northwest Bronx: Van Cortlandt Park Hike and the Fieldston Historic District",
                "location": "Van Cortlandt Park, Bronx",
                "time": "Saturday, October 31, 2026 - 11:30 AM EDT",
                "difficulty": "Moderate (~5 miles)",
                "link": "https://www.meetup.com/exploring-nyc-history-and-neighborhoods/events/316283316/"
        },
        {
                "title": "High Line Evening Walk",
                "location": "The High Line, Chelsea",
                "time": "Friday, October 22, 2026 - 6:45 PM EDT",
                "difficulty": "Easy (~1.5 miles)",
                "link": "https://www.thehighline.org/events"
        },
        {
                "title": "Hudson River Park Pier 84 Evening Walk",
                "location": "Hudson River Park Trust",
                "time": "Friday, October 22, 2026 - 6:30 PM EDT",
                "difficulty": "Easy (~2 miles)",
                "link": "https://hudsonriverpark.org/events"
        }
];

        
        function loadBaseball() {
            const container = document.getElementById('baseball-container');
            container.innerHTML = baseballData.map(item => `
                <div class="card">
                    <h3><a href="${item.link}" target="_blank">${item.teams}</a></h3>
                    <p><strong>Stadium:</strong> ${item.stadium}</p>
                    <p><strong>Day:</strong> ${item.day}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Price:</strong> ${item.price}</p>
                </div>
            `).join('');
        }

        function loadHiking() {
            const container = document.getElementById('hiking-container');
            container.innerHTML = hikingData.map(item => `
                <div class="card">
                    <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
                    <p><strong>Location:</strong> ${item.location}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Difficulty:</strong> ${item.difficulty}</p>
                </div>
            `).join('');
        }


        function updateTimestamp() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleString();
        }

        // Load all data
        loadBaseball();
        loadHiking();
        updateTimestamp();
    </script>
