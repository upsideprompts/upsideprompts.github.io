<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Stroll Stuff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764BA2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .card h3 {
            color: #444;
            margin-bottom: 8px;
        }
        .card p {
            color: #666;
            margin: 5px 0;
        }
        .card a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .baseball-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .hiking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .refresh-info {
            text-align: center;
            color: #666;
            font-style: italic;
            margin-top: 20px;
        }
        .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚾🥾 NY Stroll Stuff</h1>
            <p>Baseball & Hiking in New York</p>
        </header>

        <section class="section">
            <h2>⚾ Baseball Events</h2>
            <div class="baseball-grid" id="baseball-container">
                <!-- Baseball entries will be loaded here -->
            </div>
        </section>

        <section class="section">
            <h2>🥾 Hiking Events (NYC Area)</h2>
            <div class="hiking-grid" id="hiking-container">
                <!-- Hiking events will be loaded here -->
            </div>
        </section>

        <p class="refresh-info">Last updated: <span id="last-update">Loading...</span></p>
    </div>
    


<script>
        // November 1-3, 2026 Baseball Games - Updated for current date (October 31, 2026)
        const baseballData = [
        {

                "day": "Sunday, November 1, 2026",

                "link": "https://www.mlb.com/yankees/schedule/2026/11/01"
        },
        {
                "teams": "Los Angeles Dodgers vs San Francisco Giants",
                "stadium": "Oracle Park, San Francisco",
                "day": "Sunday, November 1, 2026",
                "time": "4:05 PM EDT",
                "price": "$80-130",
                "link": "https://www.mlb.com/giants/schedule/2026/11/01"
        },
        {
                "teams": "New York Mets vs Atlanta Braves",
                "stadium": "Citi Field, New York",
                "day": "Monday, November 2, 2026",
                "time": "7:05 PM EDT",
                "price": "$85-135",
                "link": "https://www.mlb.com/mets/schedule/2026/11/02"
        },
        {
                "teams": "New York Yankees vs Boston Red Sox",
                "stadium": "Yankee Stadium, New York",
                "day": "Tuesday, November 3, 2026",
                "time": "7:05 PM EDT",
                "price": "$95-150",
                "link": "https://www.mlb.com/yankees/schedule/2026/11/03"
        }
];

        // November 1-4, 2026 NYC hiking opportunities (current date range)
        const hikingData = [
        {
                "title": "Riverside Park Evening Walk",
                "location": "Riverside Park South, Manhattan",
                "day": "Sunday, November 1, 2026",
                "time": "6:30 PM EDT",
                "difficulty": "Easy",
                "link": "https://www.nycgovparks.org/parks/riverside-park/events"
        },
        {
                "title": "Prospect Park Sunset Loop",
                "location": "Prospect Park, Brooklyn",
                "day": "Sunday, November 1, 2026",
                "time": "6:00 PM EDT",
                "difficulty": "Easy (~3 miles)",
                "link": "https://www.nycgovparks.org/parks/prospect-park/events"
        },
        {
                "title": "High Line Tour: From Freight to Flowers",
                "location": "The High Line, Chelsea",
                "day": "Monday, November 2, 2026",
                "time": "10:00 AM EDT",
                "difficulty": "Easy to Moderate (~2 miles)",
                "link": "https://www.thehighline.org/events"
        },
        {
                "title": "Central Park Twilight Stroll",
                "location": "Central Park, Manhattan",
                "day": "Tuesday, November 3, 2026",
                "time": "5:30 PM EDT",
                "difficulty": "Easy-Moderate (~2.5 miles)",
                "link": "https://www.nycgovparks.org/parks/central-park/events"
        },
        {
                "title": "Brooklyn Bridge Park Path Walk",
                "location": "Brooklyn Bridge Park",
                "day": "Wednesday, November 4, 2026",
                "time": "8:00 AM EDT",
                "difficulty": "Easy (~2 miles)",
                "link": "https://brooklynbridgepark.org/events"
        },
        {
                "title": "Fort Tryon Park Medieval Festival Hike",
                "location": "Fort Tryon Park, Northern Manhattan",
                "day": "Wednesday, November 4, 2026",
                "time": "6:30 PM EDT",
                "difficulty": "Easy to Moderate",
                "link": "https://www.nycgovparks.org/parks/fort-tryon-park/events"
        },
        {
                "title": "Inwood Hill Park Sunset Hike",
                "location": "Inwood Hill Park, Northern Manhattan",
                "day": "Thursday, November 4, 2026",
                "time": "7:00 PM EDT",
                "difficulty": "Moderate",
                "link": "https://www.nycgovparks.org/parks/inwood-hill-park/events"
        }
];

        function loadBaseball() {
            const container = document.getElementById('baseball-container');
            container.innerHTML = baseballData.map(item => `
                <div class="card">
                    <h3><a href="${item.link}" target="_blank">${item.teams}</a></h3>
                    <p><strong>Stadium:</strong> ${item.stadium}</p>
                    <p><strong>Day:</strong> ${item.day}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Price:</strong> ${item.price}</p>
                </div>
            `).join('');
        }

        function loadHiking() {
            const container = document.getElementById('hiking-container');
            container.innerHTML = hikingData.map(item => `
                <div class="card">
                    <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
                    <p><strong>Location:</strong> ${item.location}</p>
                    <p><strong>Day:</strong> ${item.day}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Difficulty:</strong> ${item.difficulty}</p>
                </div>
            `).join('');
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleString();
        }

        // Load all data
        loadBaseball();
        loadHiking();
        updateTimestamp();
    </script>
