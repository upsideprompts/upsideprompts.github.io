<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Stroll Stuff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764BA2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .card h3 {
            color: #444;
            margin-bottom: 8px;
        }
        .card p {
            color: #666;
            margin: 5px 0;
        }
        .card a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .baseball-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .hiking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .refresh-info {
            text-align: center;
            color: #666;
            font-style: italic;
            margin-top: 20px;
        }
        .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚾🥾 NY Stroll Stuff</h1>
            <p>Baseball & Hiking in New York</p>
        </header>

        <section class="section">
            <h2>⚾ Baseball Events</h2>
            <div class="baseball-grid" id="baseball-container">
                <!-- Baseball entries will be loaded here -->
            </div>
        </section>

        <section class="section">
            <h2>🥾 Hiking Events (NYC Area)</h2>
            <div class="hiking-grid" id="hiking-container">
                <!-- Hiking events will be loaded here -->
            </div>
        </section>

        <p class="refresh-info">Last updated: <span id="last-update">Loading...</span></p>
    </div>

    <script>
        // Baseball data - Updated June 28, 2026
        const baseballData = [
            {
                teams: "New York Yankees vs Chicago White Sox",
                stadium: "Yankee Stadium",
                day: "Sunday, June 28, 2026",
                time: "1:05 PM EDT",
                price: "$85 avg",
                link: "https://www.mlb.com/yankees/schedule/2026/06/28/white-sox"
            },
            {
                teams: "New York Mets vs Atlanta Braves",
                stadium: "Citi Field",
                day: "Sunday, June 28, 2026",
                time: "1:10 PM EDT",
                price: "$95 avg",
                link: "https://www.mlb.com/mets/schedule/2026/06/28/braves"
            },
            {
                teams: "Brooklyn Cyclones vs Staten Island FerryHawks",
                stadium: "Maimonides Park",
                day: "Sunday, June 28, 2026",
                time: "6:30 PM",
                price: "$25 avg",
                link: "https://www.milb.com/cyclones/schedule/2026/06/28"
            }
        ];

        // Hiking events data - Updated June 28, 2026
        // Sunday June 28 NYC hiking opportunities
        const hikingData = [
            {
                title: "26 Anniversary Wild Hike",
                location: "Neverwinter Free Hiking and Cycling",
                time: "Sunday, June 28 - 6:50 AM EDT",
                difficulty: "Moderate",
                link: "https://www.meetup.com/neverwinter-free-hiking-and-cycling/events/314427561/"
            },
            {
                title: "Waterfall Hike & Whole Roast Lamb Experience",
                location: "Outsiders NY",
                time: "Sunday, June 28 - 8:00 AM EDT",
                difficulty: "Moderate",
                link: "https://www.meetup.com/outsiders-ny/events/313563410/"
            },
            {
                title: "Lenape Trail, Moderate Pace Hike",
                location: "DESI OUTDOORS",
                time: "Sunday, June 28 - 7:00 AM EDT",
                difficulty: "Moderate",
                link: "https://www.meetup.com/desi-outdoors-enrichment-and-recreational-activities/events/315367149/"
            },
            {
                title: "Hike in Harriman State Park",
                location: "Brodyaga / Russian adventure group",
                time: "Sunday, June 28 - 9:00 AM EDT",
                difficulty: "Moderate",
                link: "https://www.meetup.com/brodyaga/events/315374997/"
            },
            {
                title: "Hard Hike @ Schunemunk Mountain",
                location: "NYC Asian Meetup",
                time: "Sunday, June 28 - 9:00 AM EDT",
                difficulty: "Hard",
                link: "https://www.meetup.com/nycasianmeetup/events/315192885/"
            },
            {
                title: "Dog Hike w/ Lou Nocito ~ 3 miles",
                location: "South Mountain Conservancy Activities Meetup Group",
                time: "Sunday, June 28 - 10:00 AM EDT",
                difficulty: "Easy",
                link: "https://www.meetup.com/somocon/events/315185023/"
            },
            {
                title: "Pride March 6/28 -Let's meet and watch together",
                location: "Gay Men's Hiking Group",
                time: "Sunday, June 28 - 1:30 PM EDT",
                difficulty: "Easy",
                link: "https://www.meetup.com/gay-mens-hiking-group/events/315117039/"
            },
            {
                title: "Cruise to remote park replaces Red Hook",
                location: "NYC walks: Nature, beauty, & peace",
                time: "Sunday, June 28 - 12:55 PM EDT",
                difficulty: "Easy",
                link: "https://www.meetup.com/nyc-walks-nature-beauty-peace/events/315350224/"
            }
        ];

        function loadBaseball() {
            const container = document.getElementById('baseball-container');
            container.innerHTML = baseballData.map(item => `
                <div class="card">
                    <h3><a href="${item.link}" target="_blank">${item.teams}</a></h3>
                    <p><strong>Stadium:</strong> ${item.stadium}</p>
                    <p><strong>Day:</strong> ${item.day}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Price:</strong> ${item.price}</p>
                </div>
            `).join('');
        }

        function loadHiking() {
            const container = document.getElementById('hiking-container');
            container.innerHTML = hikingData.map(item => `
                <div class="card">
                    <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
                    <p><strong>Location:</strong> ${item.location}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Difficulty:</strong> ${item.difficulty}</p>
                </div>
            `).join('');
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleString();
        }

        // Load all data
        loadBaseball();
        loadHiking();
        updateTimestamp();
        // Last updated: June 28, 2026
    </script>
</body>
</html>
