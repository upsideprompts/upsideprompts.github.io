<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Stroll Stuff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764BA2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .card h3 {
            color: #444;
            margin-bottom: 8px;
        }
        .card p {
            color: #666;
            margin: 5px 0;
        }
        .card a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover {
            text-decoration: underline;
        }
        .baseball-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .hiking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .refresh-info {
            text-align: center;
            color: #666;
            font-style: italic;
            margin-top: 20px;
        }
        .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚾🥾 NY Stroll Stuff</h1>
            <p>Baseball & Hiking in New York</p>
        </header>

        <section class="section">
            <h2>⚾ Baseball Events</h2>
            <div class="baseball-grid" id="baseball-container">
                <!-- Baseball entries will be loaded here -->
            </div>
        </section>

        <section class="section">
            <h2>🥾 Hiking Events (NYC Area)</h2>
            <div class="hiking-grid" id="hiking-container">
                <!-- Hiking events will be loaded here -->
            </div>
        </section>

        <p class="refresh-info">Last updated: <span id="last-update">Loading...</span></p>
    </div>

    <script>
        // Baseball data - Updated June 23, 2026
        const baseballData = [
            {
                teams: "New York Yankees vs Detroit Tigers",
                stadium: "Yankee Stadium",
                day: "Tuesday, June 23, 2026",
                time: "6:40 PM EDT",
                price: "$135 avg",
                link: "https://www.mlb.com/yankees/schedule/2026/06/23/tigers"
            },
            {
                teams: "New York Mets vs Chicago Cubs",
                stadium: "Citi Field",
                day: "Tuesday, June 23, 2026",
                time: "7:10 PM EDT",
                price: "$85 avg",
                link: "https://www.mlb.com/mets/schedule/2026/06/23/cubs"
            },
            {
                teams: "Brooklyn Cyclones vs Jersey Shore",
                stadium: "Maimonides Park",
                day: "Tuesday, June 23, 2026",
                time: "6:30 PM",
                price: "$25 avg",
                link: "https://www.milb.com/cyclones/schedule/2026/06/23"
            },
            {
                teams: "Staten Island FerryHawks vs Road Warriors",
                stadium: "SIUH Community Park",
                day: "Tuesday, June 23, 2026",
                time: "6:30 PM",
                price: "$12 avg",
                link: "https://ferryhawks.com/sports/2026/3/6/2026-home-schedule.aspx"
            }
        ];

        // Hiking events data - Updated June 23, 2026
        // Tuesday June 23 NYC hiking opportunities
        const hikingData = [
            {
                title: "Vroman's Nose Summer Solstice BBQ Hike",
                location: "Vroman's Nose Hiking Trail, Middleburgh, NY",
                time: "Tuesday, June 23 - 6:00 PM EDT",
                difficulty: "Moderate",
                link: "https://www.meetup.com/hikingmates/events/314783378/"
            },
            {
                title: "Central Park Tuesday Walk",
                location: "Central Park, near 72nd St Entrance",
                time: "Tuesday, June 23 - 8:30 AM",
                difficulty: "Easy",
                link: "https://www.nycgovparks.org/parks/central-park"
            },
            {
                title: "Inwood Hill Park Forest Trail",
                location: "Inwood Hill Park, Manhattan",
                time: "Tuesday, June 23 - 9:00 AM",
                difficulty: "Moderate",
                link: "https://www.nycgovparks.org/park-features/hiking/inwood-hill-park"
            },
            {
                title: "Pelham Bay Park Shoreline Trail",
                location: "Pelham Bay Park, Bronx",
                time: "Tuesday, June 23 - 8:00 AM",
                difficulty: "Moderate",
                link: "https://www.nycgovparks.org/parks/pelham-bay-park"
            },
            {
                title: "Prospect Park Loop Walk",
                location: "Prospect Park, Brooklyn",
                time: "Tuesday, June 23 - 8:00 AM",
                difficulty: "Easy",
                link: "https://www.prospectpark.org/"
            },
            {
                title: "Brooklyn Bridge Park Waterfront Walk",
                location: "Brooklyn Bridge Park, Brooklyn",
                time: "Tuesday, June 23 - 8:00 AM",
                difficulty: "Easy",
                link: "https://www.brooklynbridgepark.org/"
            },
            {
                title: "Jamaica Bay Wildlife Refuge Morning Walk",
                location: "Jamaica Bay Visitor Center, Queens",
                time: "Tuesday, June 23 - 6:30 AM",
                difficulty: "Easy",
                link: "https://www.nycgovparks.org/parks/jamaica-bay-wildlife-refuge"
            },
            {
                title: "High Line Section 3 Walk",
                location: "Manhattan (14th-23rd Streets)",
                time: "Tuesday, June 23 - 9:00 AM",
                difficulty: "Easy",
                link: "https://www.thehighline.org/"
            }
        ];

        function loadBaseball() {
            const container = document.getElementById('baseball-container');
            container.innerHTML = baseballData.map(item => `
                <div class="card">
                    <h3><a href="${item.link}" target="_blank">${item.teams}</a></h3>
                    <p><strong>Stadium:</strong> ${item.stadium}</p>
                    <p><strong>Day:</strong> ${item.day}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Price:</strong> ${item.price}</p>
                </div>
            `).join('');
        }

        function loadHiking() {
            const container = document.getElementById('hiking-container');
            container.innerHTML = hikingData.map(item => `
                <div class="card">
                    <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
                    <p><strong>Location:</strong> ${item.location}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Difficulty:</strong> ${item.difficulty}</p>
                </div>
            `).join('');
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleString();
        }

        // Load all data
        loadBaseball();
        loadHiking();
        updateTimestamp();
    </script>
</body>
</html>
