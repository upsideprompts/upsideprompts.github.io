<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Trivia Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container {
            max-width: 800px; margin: 0 auto; background: white;
            border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden;
        }
        .header { background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .score-board { background: #f8f9fa; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e9ecef; }
        .score, .question-counter { font-size: 1.2em; font-weight: bold; color: #333; }
        .question-container { padding: 30px; }
        .question-text { font-size: 1.3em; margin-bottom: 25px; color: #333; line-height: 1.5; }
        .answers { display: grid; gap: 15px; }
        .answer-btn {
            background: #f8f9fa; border: 2px solid #e9ecef; padding: 15px; border-radius: 8px;
            cursor: pointer; font-size: 1em; transition: all 0.3s ease; text-align: left; color: #333;
        }
        .answer-btn:hover { background: #e9ecef; border-color: #4a90d9; transform: translateX(5px); }
        .answer-btn.correct { background: #28a745; color: white; border-color: #1e7e34; }
        .answer-btn.wrong { background: #dc3545; color: white; border-color: #bd2126; }
        .navigation { padding: 20px 30px; display: flex; justify-content: space-between; background: #f8f9fa; }
        .nav-btn { background: #4a90d9; color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-size: 1em; transition: background 0.3s; }
        .nav-btn:hover { background: #357abd; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
        .result-screen { padding: 50px 30px; text-align: center; display: none; }
        .result-screen.active { display: block; }
        .score-circle { width: 150px; height: 150px; background: linear-gradient(135deg, #4a90d9 0%, #357abd 100%); border-radius: 50%; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; font-size: 3em; color: white; font-weight: bold; }
        .explanation { background: #e7f3ff; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; border-left: 4px solid #4a90d9; }
        .explanation.active { display: block; }
        .controls { padding: 20px 30px; background: #f8f9fa; border-top: 1px solid #e9ecef; }
        .start-btn { background: #28a745; color: white; border: none; padding: 15px 40px; border-radius: 25px; cursor: pointer; font-size: 1.1em; transition: background 0.3s; margin: 0 auto; display: block; }
        .start-btn:hover { background: #218838; }
        .start-btn:disabled { background: #ccc; cursor: not-allowed; }
        .game-mode-selector { display: flex; gap: 10px; margin: 15px auto; max-width: 400px; }
        .mode-btn { flex: 1; padding: 10px; border: 2px solid #4a90d9; background: white; cursor: pointer; border-radius: 8px; transition: all 0.3s; }
        .mode-btn.active { background: #4a90d9; color: white; }
        .mode-btn:hover:not(.active) { background: #e9ecef; }
        .random-indicator { text-align: center; color: #666; margin: 10px 0; font-style: italic; }
    
        .correct-btn { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .wrong-btn { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .correct-answer {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #4a90d9;
            font-weight: bold;
            color: #155724;
            display: none;
        }
        .correct-answer.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Python Trivia Quiz</h1>
            <p>Choose your game mode and test your Python knowledge!</p>
        </div>
        
        <div class="controls" id="setup-screen">
            <div class="intro-text" style="text-align: center; font-size: 1.5em; margin: 30px 0; color: #4a90d9; font-weight: bold;">
                Try your Python knowledge, via ATL
            </div>
            <button class="start-btn" id="start-btn" onclick="startQuiz()">Start Quiz</button>
        </div>

        <div class="score-board" id="score-board" style="display: none;">
            <div class="score">Score: <span id="score">0</span>/<span id="total-questions">20</span></div>
            <div class="question-counter">Question: <span id="current-q">1</span>/<span id="max-q">20</span></div>
        </div>
        
        <div class="question-container" id="quiz-container" style="display: none;">
            <div class="question-text" id="question-text"></div>
            <div class="answers" id="answers"></div>
            <div class="explanation" id="explanation"></div>
 <div class="correct-answer" id="correct-answer"></div>       </div>
        
        <div class="result-screen" id="result-screen">
            <div class="score-circle" id="final-score">0</div>
            <div class="result-message" id="result-message"></div>
            <button class="nav-btn" onclick="restartQuiz()">Restart Quiz</button>
        </div>
        
        <div class="navigation" id="navigation" style="display: none;">
            <button class="nav-btn" id="prev-btn" onclick="previousQuestion()" disabled>Previous</button>
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>Next</button>

            <script>
    // Initialize variables
    let score = 0;
    let currentQuestion = 0;
    let questionsToUse = [];
    let answered = false;
    let selectedMode = 'classic';

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function shuffle(array) {
        const a = [...array];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // Questions database
    const questions = [
        {
            question: "What keyword is used to define a function in Python?",
            correct: "def",
            wrong: ["function", "define", "func"],
            explanation: "The 'def' keyword is used to define functions in Python."
        },
        {
            question: "Which symbol is used for single-line comments in Python?",
            correct: "#",
            wrong: ["//", "/*", "--"],
            explanation: "The '#' character is used for single-line comments."
        },
        {
            question: "What is the correct way to create an empty list in Python?",
            correct: "[]",
            wrong: ["{}", "()", "{}"],
            explanation: "Empty square brackets [] create an empty list."
        },
        {
            question: "Which data type is immutable in Python?",
            correct: "tuple",
            wrong: ["list", "dict", "set"],
            explanation: "Tuples are immutable in Python, unlike lists."
        },
        {
            question: "What method returns all keys in a dictionary?",
            correct: "keys()",
            wrong: ["values()", "items()", "get()"],
            explanation: "The keys() method returns all keys in a dictionary."
        },
        {
            question: "Which operator is used for exponentiation in Python?",
            correct: "**",
            wrong: ["^", "%", "//"],
            explanation: "The ** operator is used for exponentiation."
        },
        {
            question: "What will len([1, 2, 3]) return?",
            correct: "3",
            wrong: ["1", "2", "4"],
            explanation: "len() returns the number of items in the list: 3."
        },
        {
            question: "Which keyword is used to exit a loop?",
            correct: "break",
            wrong: ["exit", "continue", "stop"],
            explanation: "The 'break' keyword exits a loop."
        },
        {
            question: "What does 'None' represent in Python?",
            correct: "null value",
            wrong: ["integer", "string", "boolean"],
            explanation: "None represents a null value or absence of value."
        },
        {
            question: "Which method removes an element from the end of a list?",
            correct: "pop()",
            wrong: ["remove()", "delete()", "discard()"],
            explanation: "pop() removes and returns the last element of a list."
        }
    ];

    function startQuiz() {
        selectedMode = 'classic';
        questionsToUse = [...questions];
        score = 0;
        currentQuestion = 0;
        
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('score-board').style.display = 'flex';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('navigation').style.display = 'flex';
        document.getElementById('start-btn').style.display = 'none';
        
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('classic-btn').classList.add('active');
        
        const indicator = document.getElementById('random-indicator');
        if (selectedMode === 'classic') {
            indicator.textContent = 'Classic mode includes all 10 questions';
        } else {
            indicator.textContent = 'Random mode picks 5 questions out of 10';
        }
        
        displayQuestion();
    }

    function displayQuestion() {
        const q = questionsToUse[currentQuestion];
        const answers = shuffle([q.correct, ...q.wrong]);
        document.getElementById('question-text').textContent = q.question;
        document.getElementById('current-q').textContent = currentQuestion + 1;
        document.getElementById('score').textContent = score;
        document.getElementById('explanation').classList.remove('active');
        document.getElementById('explanation').textContent = '';
        answered = false;
        
        // Use safe button creation with data attributes
        const answersHTML = answers.map(a => 
            `<button class="answer-btn" onclick="selectAnswer('${a}', '${q.correct}', ${a} === ${q.correct})">${escapeHtml(a)}</button>`
        ).join('');
        document.getElementById('answers').innerHTML = answersHTML;
        
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        document.getElementById('next-btn').disabled = true;
    }

    function selectAnswer(selected, correct, isCorrect) {
        if (answered) return;
        answered = true;
        
        // Simple: just disable all buttons
        const buttons = document.querySelectorAll('.answer-btn');
        buttons.forEach(btn => {
            btn.disabled = true;
        });
        
        // Show correct answer at bottom
        document.getElementById('correct-answer').textContent = 'Correct: ' + correct;
        document.getElementById('correct-answer').classList.add('show');
        
        // Update score
        if (isCorrect) score++;
        document.getElementById('score').textContent = score;
        
        // Show explanation
        document.getElementById('explanation').textContent = questionsToUse[currentQuestion].explanation;
        document.getElementById('explanation').classList.add('active');
        
        // Enable next button
        document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
        if (currentQuestion < questionsToUse.length - 1) {
            currentQuestion++;
            displayQuestion();
        } else showResults();
    }

    function previousQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            displayQuestion();
        }
    }

    function showResults() {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('navigation').style.display = 'none';
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').textContent = score;
        const percentage = (score / questionsToUse.length) * 100;
        const msgs = [
            'Perfect! You know your Python trivia!',
            'Excellent!',
            'Good job!',
            'Keep practicing!',
            'Study more!'
        ];
        if (percentage >= 80) {
            document.getElementById('result-message').textContent = msgs[0];
        } else if (percentage >= 60) {
            document.getElementById('result-message').textContent = msgs[1];
        } else if (percentage >= 40) {
            document.getElementById('result-message').textContent = msgs[2];
        } else if (percentage >= 20) {
            document.getElementById('result-message').textContent = msgs[3];
        } else {
            document.getElementById('result-message').textContent = msgs[4];
        }
    }

    function restartQuiz() {
        document.getElementById('result-screen').classList.remove('active');
        startQuiz();
    }

    displayQuestion();
</script>
</body>
</html>
