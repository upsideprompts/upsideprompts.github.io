<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Comparison Dashboard</title>
    <style>
        :root {
            --primary: #87ceeb;
            --primary-dark: #5f9ea0;
            --secondary: #b0e0e6;
            --accent: #4682b4;
            --light: #f0f8ff;
            --dark: #191970;
            --success: #2e8b57;
            --danger: #dc143c;
            --warning: #ffd700;
            --info: #4169e1;
            --model-1: #ff6b6b;
            --model-2: #4ecdc4;
            --model-3: #ffe66d;
            --model-4: #a8e6cf;
            --model-5: #ffb3ba;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(135, 206, 235, 0.3);
            position: relative;
        }

        .side-image {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 225px;
            height: auto;
            border-radius: 5px;
            z-index: 100;
        }

        h1 {
            color: var(--dark);
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--primary-dark);
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .sort-btn {
            padding: 12px 24px;
            border: 2px solid var(--primary);
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            color: var(--dark);
            transition: all 0.3s ease;
        }

        .sort-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(135, 206, 235, 0.4);
        }

        .sort-btn.active {
            background: var(--accent);
            color: white;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .dashboard {
            display: grid;
            gap: 20px;
        }

        .category {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(135, 206, 235, 0.2);
            transition: all 0.3s ease;
        }

        .category-header {
            padding: 20px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--dark);
        }

        .category-header:hover {
            background: linear-gradient(90deg, var(--primary-dark), var(--accent));
            color: white;
        }

        .toggle-icon {
            transition: transform 0.3s ease;
            font-size: 1.2em;
        }

        .category.open .toggle-icon {
            transform: rotate(180deg);
        }

        .category-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .scrollable-columns {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 600px;
        }

        .scrollable-columns table {
            min-width: 800px;
        }

        .category.open .category-content {
            max-height: 2000px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--secondary);
            font-size: 55%;
        }

        th {
            background: var(--light);
            color: var(--dark);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: var(--primary);
            color: white;
        }

        th.sortable-model {
            cursor: pointer;
            user-select: none;
        }

        th.sortable-model:hover {
            background: var(--primary);
            color: white;
        }

        tr:hover {
            background: rgba(135, 206, 235, 0.1);
        }

        .model-name {
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        .model-name:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .model-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 85%;
            font-weight: 600;
            margin-right: 5px;
        }

        .model-1-tag { background: var(--model-1); color: white; }
        .model-2-tag { background: var(--model-2); color: white; }
        .model-3-tag { background: var(--model-3); color: var(--dark); }
        .model-4-tag { background: var(--model-4); color: var(--dark); }
        .model-5-tag { background: var(--model-5); color: var(--dark); }

        .metric-positive, .month-return.positive { color: var(--success); font-weight: 600; }
        .metric-negative, .month-return.negative { color: var(--danger); font-weight: 600; }
        .metric-warning, .month-return.warning { color: var(--warning); font-weight: 600; }
        .metric-info { color: var(--info); font-weight: 600; }

        .selected {
            animation: selectAnim 0.5s ease;
            background: rgba(135, 206, 235, 0.2);
        }

        @keyframes selectAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); background: rgba(135, 206, 235, 0.4); }
            100% { transform: scale(1); }
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: var(--primary-dark);
        }

        .model-info {
            font-size: 85%;
            color: var(--dark);
            margin-top: 5px;
        }

        .provider-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            background: var(--light);
            border: 1px solid var(--primary);
            font-size: 80%;
            margin-right: 5px;
        }
        
        .description {
            font-size: 85%;
            color: var(--dark);
            margin-top: 5px;
            line-height: 1.4;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="ocstacks/screens/deskpic1.png" alt="Desk Pic" class="side-image">
            <h1>🤖 LLM Comparison Dashboard</h1>
            <p class="subtitle">Kimi, Gemini, Claude Opus & Open Source Models • Compare capabilities, pricing, and features</p>
        </header>

        <div class="controls">
            <button class="sort-btn active" onclick="sortModels('capability', this)">Sort by Capability</button>
            <button class="sort-btn" onclick="sortModels('speed', this)">Sort by Speed</button>
            <button class="sort-btn" onclick="sortModels('cost', this)">Sort by Cost</button>
            <button class="sort-btn" onclick="sortModels('model', this)">Sort Alphabetical</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: var(--model-1);"></div>
                <span>Open Source</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: var(--model-2);"></div>
                <span>Commercial</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: var(--model-3);"></div>
                <span>API Accessible</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: var(--model-4);"></div>
                <span>Local Deployable</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: var(--model-5);"></div>
                <span>Customizable</span>
            </div>
        </div>

        <div class="dashboard" id="dashboard">
            <!-- Categories will be generated by JavaScript -->
        </div>

        <footer>
            <p>LLM comparison data refreshed daily • Click model names for details • Sort by performance metrics</p>
        </footer>
    </div>

    <script>
        const modelData = {
            "Open Source": {
                "General Purpose": [
                    { 
                        name: "<a href=\"https://github.com/XuYangGit/FasterTransformer/tree/main/examples/kiminet\" class=\"model-name\">Kimi</a>", 
                        provider: "Moonshot AI", 
                        parameters: "180B parameters", 
                        speed: "High", 
                        cost: "$0.002/M tokens", 
                        capability: 9.2,
                        languages: "100+", 
                        webSearch: "No",
                        fineTuning: "Yes",
                        license: "Proprietary",
                        siteUrl: "https://www.moonshot.ai/",
                        tags: ["commercial", "api-accessible", "proprietary"],
                        description: "Kimi is a powerful language model from Moonshot AI with exceptional reasoning capabilities and high performance across diverse tasks."
                    },
                    { 
                        name: "<a href=\"https://github.com/microsoft/onnxruntime\" class=\"model-name\">Mistral 7B</a>", 
                        provider: "Mistral AI", 
                        parameters: "7B parameters", 
                        speed: "Very Fast", 
                        cost: "$0.00005/M tokens", 
                        capability: 8.5,
                        languages: "30+", 
                        webSearch: "No",
                        fineTuning: "Yes",
                        license: "MIT",
                        siteUrl: "https://console.anthropic.com/",
                        tags: ["open-source", "api-accessible", "fine-tuning", "fast", "small-model"],
                        description: "Mistral 7B is a highly efficient open source model that achieves state-of-the-art performance despite its smaller size."
                    },
                    { 
                        name: "<a href=\"https://github.com/cohere-ai/cohere-python-sdk\" class=\"model-name\">Falcon 40B</a>", 
                        provider: "TII UAE", 
                        parameters: "40B parameters", 
                        speed: "High", 
                        cost: "$0.0002/M tokens", 
                        capability: 8.8,
                        languages: "100+", 
                        webSearch: "No",
                        fineTuning: "Yes",
                        license: "Apache 2.0",
                        siteUrl: "https://console.anthropic.com/",
                        tags: ["open-source", "api-accessible", "fine-tuning", "100-language", "medium-model"],
                        description: "Falcon 40B delivers competitive performance while maintaining open source accessibility for research and commercial use."
                    },
                    { 
                        name: "<a href=\"https://github.com/huggingface/transformers\" class=\"model-name\">Llama 3.1</a>", 
                        provider: "Meta", 
                        parameters: "405B parameters", 
                        speed: "High", 
                        cost: "$0.0001/M tokens", 
                        capability: 9.2,
                        languages: "100+", 
                        webSearch: "No",
                        fineTuning: "Yes",
                        license: "Apache 2.0",
                        siteUrl: "https://console.anthropic.com/",
                        tags: ["open-source", "api-accessible", "fine-tuning", "100-language", "large-model"],
                        description: "Llama 3.1 is Meta's latest open source model with improved capabilities and multilingual support."
                    }
                ]
            },
            "Commercial": {
                "General Purpose": [
                    { 
                        name: "<a href=\"https://console.anthropic.com/\" class=\"model-name\">Claude 3.5 Opus</a>", 
                        provider: "Anthropic", 
                        parameters: "200K context", 
                        speed: "High", 
                        cost: "$0.008/M tokens", 
                        capability: 10.0,
                        languages: "100+", 
                        webSearch: "No",
                        fineTuning: "No",
                        license: "Proprietary",
                        siteUrl: "https://console.anthropic.com/",
                        tags: ["commercial", "premium", "large-context", "proprietary"],
                        description: "Claude 3.5 Opus is Anthropic's most powerful model with exceptional reasoning and complex task handling capabilities."
                    },
                    { 
                        name: "<a href=\"https://openai.com/blog/gpt-4\" class=\"model-name\">GPT-4 Turbo</a>", 
                        provider: "OpenAI", 
                        parameters: "128K context", 
                        speed: "High", 
                        cost: "$0.01/M tokens", 
                        capability: 9.9,
                        languages: "50+", 
                        webSearch: "Yes",
                        fineTuning: "No",
                        license: "Proprietary",
                        siteUrl: "https://console.anthropic.com/",
                        tags: ["commercial", "api-accessible", "web-search", "proprietary"],
                        description: "GPT-4 Turbo provides powerful AI capabilities with web search functionality and strong performance across complex tasks."
                    },
                    { 
                        name: "<a href=\"https://gemini.google.ai/\" class=\"model-name\">Gemini 1.5 Pro</a>", 
                        provider: "Google", 
                        parameters: "1M context", 
                        speed: "Very High", 
                        cost: "$0.007/M tokens", 
                        capability: 9.7,
                        languages: "100+", 
                        webSearch: "Yes",
                        fineTuning: "No",
                        license: "Proprietary",
                        siteUrl: "https://console.anthropic.com/",
                        tags: ["commercial", "api-accessible", "web-search", "large-context", "proprietary"],
                        description: "Gemini 1.5 Pro excels with massive context windows and multimodal capabilities for complex reasoning tasks."
                    }
                ]
            }
        };

        // Track current sort state
        let currentSort = 'capability'; // 'capability', 'speed', 'cost', 'model'

        function initDashboard() {
            const dashboard = document.getElementById('dashboard');
            let html = '';

            for (const [category, data] of Object.entries(modelData)) {
                const categoryId = category.replace(/\s+/g, '');
                html += `
                    <div class="category" id="cat-${categoryId}">
                        <div class="category-header" onclick="toggleCategory('${categoryId}')">
                            <span>${category}</span>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="category-content">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Model Name</th>
                                        <th>Provider</th>
                                        <th>Parameters</th>
                                        <th class="sortable-model" id="sort-header" onclick="toggleSort(this);">Capability ▼</th>
                                        <th>Speed</th>
                                        <th>Cost</th>
                                        <th>Tags</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-${categoryId}">
                                    ${createModelRows(category, data)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            dashboard.innerHTML = html;
            
            // Open first category by default
            toggleCategory('OpenSource');
        }

        function createModelRows(category, data) {
            let rows = '';
            const allModels = [];
            
            for (const subcategory of Object.values(data)) {
                allModels.push(...subcategory);
            }
            
            allModels.sort((a, b) => {
                if (currentSort === 'capability') return b.capability - a.capability;
                if (currentSort === 'speed') {
                    const speedOrder = { 'Very Fast': 4, 'Fast': 3, 'High': 2, 'Medium': 1, 'Slow': 0 };
                    return speedOrder[b.speed] - speedOrder[a.speed];
                }
                if (currentSort === 'cost') {
                    const costOrder = { '$0.00005/M tokens': 5, '$0.0001/M tokens': 4, '$0.0002/M tokens': 3, '$0.003/M tokens': 2, '$0.007/M tokens': 1, '$0.01/M tokens': 0, '$0.008/M tokens': 0.5, '$0.015/M tokens': 0.2 };
                    return costOrder[a.cost] - costOrder[b.cost];
                }
                return a.name.localeCompare(b.name);
            });
            
            allModels.forEach(model => {
                const tagElements = model.tags.map(tag => `<span class="model-tag model-${tag}-tag">${tag}</span>`).join('');
                const providerBadge = `<span class="provider-badge">${model.provider}</span>`;
                
                rows += `
                    <tr onclick="selectRow(this)">
                        <td>
                            <div>${model.name}</div>
                            <div class="model-info">${model.parameters} • ${model.languages} languages</div>
                            <div class="description">${model.description}</div>
                        </td>
                        <td>${providerBadge}</td>
                        <td>${model.parameters}</td>
                        <td class="metric-${getCapabilityClass(model.capability)}">${model.capability.toFixed(1)}</td>
                        <td class="metric-info">${model.speed}</td>
                        <td class="metric-${getCostClass(model.cost)}">${model.cost}</td>
                        <td>${tagElements}</td>
                    </tr>
                `;
            });
            
            return rows;
        }

        function getCapabilityClass(cap) {
            if (cap >= 9.5) return 'positive';
            if (cap >= 9.0) return 'info';
            if (cap >= 8.0) return 'warning';
            return 'negative';
        }

        function getCostClass(cost) {
            if (cost.includes('$0.00005')) return 'positive';
            if (cost.includes('$0.0001')) return 'info';
            if (cost.includes('$0.0015')) return 'warning';
            return 'negative';
        }

        function toggleCategory(categoryId) {
            const category = document.getElementById(`cat-${categoryId}`);
            category.classList.toggle('open');
        }

        function toggleSort(el) {
            const header = document.getElementById('sort-header');
            
            if (currentSort === 'capability') {
                // Currently capability, switch to speed
                currentSort = 'speed';
                header.textContent = 'Capability ▲';
                sortModels('speed', el);
            } else if (currentSort === 'speed') {
                // Currently speed, switch to cost
                currentSort = 'cost';
                header.textContent = 'Capability ▼';
                sortModels('cost', el);
            } else if (currentSort === 'cost') {
                // Currently cost, switch to alphabetical
                currentSort = 'model';
                header.textContent = 'Capability ▼';
                sortModels('model', el);
            } else {
                // Currently alphabetical, switch to capability
                currentSort = 'capability';
                header.textContent = 'Capability ▼';
                sortModels('capability', el);
            }
        }

        function sortModels(criteria, buttonElement) {
            // Remove active class from all buttons
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            // Add active class to clicked button
            if (buttonElement) {
                buttonElement.classList.add('active');
            }

            const dashboard = document.getElementById('dashboard');
            const categories = Object.keys(modelData);

            categories.forEach(category => {
                const categoryId = category.replace(/\s+/g, '');
                const tbody = document.getElementById(`tbody-${categoryId}`);
                const rows = Array.from(tbody.querySelectorAll('tr'));

                rows.sort((a, b) => {
                    let aVal, bVal;
                    
                    switch(criteria) {
                        case 'capability':
                            aVal = parseFloat(a.cells[3].textContent);
                            bVal = parseFloat(b.cells[3].textContent);
                            return bVal - aVal;
                        case 'speed':
                            const speedOrder = { 'Very Fast': 4, 'Fast': 3, 'High': 2, 'Medium': 1, 'Slow': 0 };
                            aVal = speedOrder[a.cells[4].textContent];
                            bVal = speedOrder[b.cells[4].textContent];
                            return bVal - aVal;
                        case 'cost':
                            const costOrder = { '$0.00005/M tokens': 5, '$0.0001/M tokens': 4, '$0.0002/M tokens': 3, '$0.003/M tokens': 2, '$0.007/M tokens': 1, '$0.01/M tokens': 0, '$0.008/M tokens': 0.5, '$0.015/M tokens': 0.2 };
                            aVal = costOrder[a.cells[5].textContent];
                            bVal = costOrder[b.cells[5].textContent];
                            return aVal - bVal;
                        case 'model':
                            aVal = a.cells[0].textContent.toLowerCase();
                            bVal = b.cells[0].textContent.toLowerCase();
                            return aVal.localeCompare(bVal);
                        default:
                            return 0;
                    }
                });

                rows.forEach(row => tbody.appendChild(row));
            });
        }

        function selectRow(row) {
            // Remove previous selection
            document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
            // Add selection to clicked row
            row.classList.add('selected');
        }

        // Initialize dashboard on load
        initDashboard();
    </script>
</body>
</html>
