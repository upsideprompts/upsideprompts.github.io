<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Trivia Quiz : Memphis Rappers</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Python Trivia Quiz : <span class="memphis">Memphis Rappers</span></h1>
            <p class="meta" id="quizMeta"></p>
        </header>

        <section class="card" id="app">
            <h2 class="question" id="questionText">Loading…</h2>

            <img class="image" id="questionImage" alt="" hidden />

            <div class="choices" id="choices"></div>

            <p class="answer-feedback" id="answerFeedback" aria-live="polite"></p>

            <div class="controls">
                <button class="btn" id="prevBtn" type="button">Previous</button>
                <button class="btn" id="nextBtn" type="button">Next</button>
                <button class="btn primary" id="submitBtn" type="button">Submit</button>
            </div>

            <div class="progress">
                <div class="bar" id="progressBar"></div>
            </div>
            <p class="meta" id="progressText"></p>

            <div class="card-bottom">
                <button class="btn do20-btn" id="do20Btn" type="button" hidden>Do 20 questions</button>
            </div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
