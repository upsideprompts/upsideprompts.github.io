<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OCStack Steps</title>
<style>
  body {
    background-color: #add8e6; /* light blue */
    font-size: 20pt; /* base font size */
    margin: 20px;
    font-family: Arial, sans-serif;
    color: #000000; /* black text */
  }
  h1 {
    text-align: center;
    font-size: 28pt;
  }
  .step-title {
    color: #194D36;
    background-color: #6495ED; /* cornflower blue */
    font-weight: bold;
    font-size: 26pt; /* increased by 30% */
    padding: 5px 10px;
    margin: 25px 0 10px 0;
    display: block;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
  }
  .step-desc {
    color: #000000; /* black text */
    margin: 0 auto 15px auto;
    font-size: 24pt; /* increased by 20% */
    line-height: 1.4;
    max-width: 800px;
    text-align: left; /* left justified */
  }
  .step-desc a {
    color: #0000ff;
    text-decoration: underline;
  }
  /* Code Snippet Box Styling */
  .code-box {
    background-color: #1e1e1e;
    color: #f8f8f2;
    font-family: 'Courier New', Courier, monospace;
    font-size: 18pt;
    padding: 15px;
    margin: 10px auto 20px auto;
    border-radius: 6px;
    max-width: 800px;
    white-space: pre-wrap;
    word-break: break-all;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .code-label {
    color: #00008B; /* Dark Blue color for bracket labels */
    font-weight: bold;
    font-size: 16pt;
    margin-top: 10px;
    display: block;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>

<h1>Openclaw Deployment with DigitalOcean and GitHub.</h1>
<div id="steps"></div>

<img src="screens/deskpic1.png" alt="" height="225"
          width="330">

<script>
const steps = [
  { 
    title: "Create a DigitalOcean Account and Project", 
    desc: "Load up <a href=\"https://www.digitalocean.com\" target=\"_blank\">DigitalOcean</a>, create an account, and go to the dashboard where you'll create a new Droplet project." 
  },
  { 
    title: "Deploy the Ubuntu Droplet", 
    desc: "Navigate to 'Create' and select 'Droplet' to begin configuration. For the image, choose Ubuntu (latest LTS) and finalize your selection with the following specifications: Regular Disk Type: SSD, Plan: 2 vCPU - 2 GB RAM - 60 GB SSD - 3 TB Transfer. Should be less than $20 a month." 
  },
  { 
    title: "Sign in and Install Openclaw", 
    desc: "From the DigitalOcean dashboard select “Web Console”. Once shell loads, start with the following for install:",
    codeBlocks: [
      { label: "[Add the latest Node.js]", code: "curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -\nsudo apt-get install -y nodejs" },
      { label: "[Secure your websockets]", code: "sudo ufw default deny incoming\nsudo ufw default allow outgoing\nsudo ufw allow ssh\nsudo ufw enable" },
      { label: "[Install Openclaw]", code: "npm install -g openclaw@latest" }
    ]
  },
  { 
    title: "Initialize Openclaw", 
    desc: "Run onboard, select all the defaults first time. Openrouter and Slack to be added afterwards:",
    codeBlocks: [
      { label: "", code: "openclaw onboard" }
    ],
    extraDesc: "You can run Openclaw to try a couple tasks :",
    extraCodeBlocks: [
      { label: "", code: "openclaw tui" }
    ]
  },
  { 
    title: "Add Openrouter to Openclaw", 
    desc: "Create an OpenRouter account at <a href=\"https://openrouter.ai\" target=\"_blank\">openrouter.ai</a>, select the option “View your API Keys” and click “New Key” at the top right.<br><br>Can leave the “Expiration” as “No expiration”, give the key a name and “Create”.<br><br>For “Credits” on the left, add about $10. It should hardly be used since you’ll be using the free models.<br><br>On DigitalOcean, load the WebConsole again and run the configuration:",
    codeBlocks: [
      { label: "", code: "openclaw onboard" }
    ],
    extraDesc: "Select the “Provider” as “OpenRouter”, paste the key you got from OpenRouter and save.<br><br>Open the configuration file to enforce a free model so you don't use up accidental credits during testing (Bash):",
    extraCodeBlocks: [
      { label: "", code: "nano ~/.openclaw/config.json5" }
    ],
    moreDesc: "Modify or add the agents property block to map directly to permanent free models (like Gemini 2.5 Flash Free):",
    moreCodeBlocks: [
      { label: "", code: "{\n  \"agents\": {\n    \"defaults\": {\n      \"workspace\": \"/root/.openclaw/workspace\",\n      \"models\": {\n        \"openrouter/free\": {\n          \"alias\": \"OpenRouter\"\n        },\n        \"openrouter/poolside/laguna-xs.2:free\": {},\n        \"openrouter/google/gemma-4-26b-a4b-it:free\": {},\n        \"openrouter/meta-llama/llama-3.3-70b-instruct:free\": {},\n        \"openrouter/qwen/qwen3-next-80b-a3b-instruct:free\": {},\n        \"openrouter/google/gemma-4-31b-it:free\": {},\n        \"openrouter/cohere/north-mini-code:free\": {},\n        \"openrouter/poolside/laguna-m.1:free\": {}\n      },\n      \"model\": {\n        \"primary\": \"openrouter/poolside/laguna-xs.2:free\",\n        \"fallbacks\": [\n          \"openrouter/poolside/laguna-xs.2:free\",\n          \"openrouter/google/gemma-4-26b-a4b-it:free\",\n          \"openrouter/meta-llama/llama-3.3-70b-instruct:free\",\n          \"openrouter/qwen/qwen3-next-80b-a3b-instruct:free\",\n          \"openrouter/google/gemma-4-31b-it:free\",\n          \"openrouter/cohere/north-mini-code:free\",\n          \"openrouter/poolside/laguna-m.1:free\"\n        ]\n      }\n    }\n  }\n}" }
    ],
    finalDesc: "Press Ctrl + O, then Enter to save, and Ctrl + X to exit nano."
  },
  { 
    title: "Create GitHub Account", 
    desc: "Set up a new <a href=\"https://github.com\" target=\"_blank\">GitHub</a> account dedicated to this project via GitHub.com." 
  },
  { 
    title: "Generate GitHub PAT", 
    desc: "From Github, go to your profile -> Developer Settings -> Personal access tokens -> Generate new token. Select 'repo scope' allowing bot to write to Github, then copy the generated token.<br><br>On DigitalOcean from the WebConsole, authenticate Openclaw with the token:",
    codeBlocks: [
      { label: "", code: "gh auth login" }
    ],
    extraDesc: "Then view the account from GitHub’s active:",
    extraCodeBlocks: [
      { label: "", code: "gh auth status" }
    ]
  },
  { 
    title: "Create Slack App", 
    desc: "Create a new slack account. Go to <a href=\"https://api.slack.com/apps\" target=\"_blank\">api.slack.com/apps</a> and select “Create an App”, then “From scratch”. Assign it to your workspace.<br><br><b>Add “App Token”</b> This token manages the secure WebSocket connection between your machine and Slack so you don't have to expose public HTTP ports.<br>In the left sidebar, click on Socket Mode and toggle Enable Socket Mode to On.<br>A window will pop up asking you to generate an App-Level Token.<br>Give it a token name (e.g., openclaw-socket) and click Add Scope to select <code>connections:write</code>.<br>Click Generate. Copy the token that appears—it will start with xapp-.<br><br><b>Add “Bot Token”</b> This token dictates what your AI assistant is actually allowed to see and do inside your channels.<br>In the left sidebar, navigate to Features > OAuth & Permissions.<br>Scroll down to the Scopes section. Under Bot Token Scopes, click Add an OAuth Scope and add the required permissions for your bot. At a minimum, you will need:<br>• chat:write (Allows the bot to send messages)<br>• app_mentions:read (Allows it to see when it's tagged with @OpenClaw)<br>• im:history, im:read, and im:write (Allows it to function in Direct Messages)<br><br>Scroll back to the top of the OAuth & Permissions page and click Install to Workspace (then click Allow to confirm).<br>Once installed, copy the Bot User OAuth Token—it will start with xoxb-.<br>Have a copy of both tokens, you’ll add them to Openclaw.<br><br>Go back to your Slack API Apps Dashboard and click on your Slack app.<br>In the left sidebar, click on Install App (found under the Settings section).<br>Click the big Install to Workspace button.<br>Review the permissions requested by your bot, select the default channel where it should be allowed to post, and click Allow.<br><br>Additional info: <a href=\"https://sfailabs.com/guides/how-to-get-slack-bot-token\" target=\"_blank\">https://sfailabs.com/guides/how-to-get-slack-bot-token</a>" 
  },
  { 
    title: "Add Slack to OpenClaw", 
    desc: "Run onboard to add Slack as the channel. From the DigitalOcean WebConsole:",
    codeBlocks: [
      { label: "", code: "openclaw onboard" }
    ],
    extraDesc: "At the “Channel” option, select “Slack” and paste in the tokens. Once completed, save all."
  },
  { 
    title: "Load OpenClaw on Slack to Launch", 
    desc: "From your Slack, invite the bot to a Slack channel. Ask your Openclaw bot to do a task. This should give the initial confirmation. Back on your DigitalOcean WebConsole complete the slack pairing option:",
    codeBlocks: [
      { label: "", code: "openclaw pairing approve slack <YOUR_PAIRING_CODE>" }
    ],
    extraDesc: "From your slack channel you can give it more tasks. You can have it send you daily sports updates or current events. You can have it send you daily 10am updates, or revise a webpage for you 1pm daily. It can do various projects, and save results on your DigitalOcean Droplet to revise."
  }
];

document.addEventListener('DOMContentLoaded', function() {
  const container = document.getElementById('steps');
  
  steps.forEach((step, i) => {
    // Step Title Block
    const titleDiv = document.createElement('div');
    titleDiv.className = 'step-title';
    titleDiv.textContent = 'Step ' + (i + 1) + ': ' + step.title;
    container.appendChild(titleDiv);
    
    // Main Description Block
    const descDiv = document.createElement('div');
    descDiv.className = 'step-desc';
    descDiv.innerHTML = step.desc;
    container.appendChild(descDiv);
    
    // Optional Primary Code Blocks
    if (step.codeBlocks) {
      step.codeBlocks.forEach(block => {
        if(block.label) {
          const label = document.createElement('span');
          label.className = 'code-label';
          label.textContent = block.label;
          container.appendChild(label);
        }
        const codeDiv = document.createElement('div');
        codeDiv.className = 'code-box';
        codeDiv.textContent = block.code;
        container.appendChild(codeDiv);
      });
    }

    // Optional Secondary Descriptions
    if (step.extraDesc) {
      const extraDescDiv = document.createElement('div');
      extraDescDiv.className = 'step-desc';
      extraDescDiv.innerHTML = step.extraDesc;
      container.appendChild(extraDescDiv);
    }

    // Optional Secondary Code Blocks
    if (step.extraCodeBlocks) {
      step.extraCodeBlocks.forEach(block => {
        if(block.label) {
          const label = document.createElement('span');
          label.className = 'code-label';
          label.textContent = block.label;
          container.appendChild(label);
        }
        const codeDiv = document.createElement('div');
        codeDiv.className = 'code-box';
        codeDiv.textContent = block.code;
        container.appendChild(codeDiv);
      });
    }

    // Optional Tertiary Descriptions (Used in Step 5 layout details)
    if (step.moreDesc) {
      const moreDescDiv = document.createElement('div');
      moreDescDiv.className = 'step-desc';
      moreDescDiv.innerHTML = step.moreDesc;
      container.appendChild(moreDescDiv);
    }

    if (step.moreCodeBlocks) {
      step.moreCodeBlocks.forEach(block => {
        const codeDiv = document.createElement('div');
        codeDiv.className = 'code-box';
        codeDiv.textContent = block.code;
        container.appendChild(codeDiv);
      });
    }

    if (step.finalDesc) {
      const finalDescDiv = document.createElement('div');
      finalDescDiv.className = 'step-desc';
      finalDescDiv.innerHTML = step.finalDesc;
      container.appendChild(finalDescDiv);
    }

    // CARRIAGE RETURN: Appends spacing after each step block concludes
    const spacer = document.createElement('br');
    const spacerTwo = document.createElement('br');
    container.appendChild(spacer);
    container.appendChild(spacerTwo);
  });
});
</script>
</body>
</html>
