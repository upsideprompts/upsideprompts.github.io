name: baseballbits
description: Baseball Bits — Flutter quote slider (Dart-first web app)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - quotes.json
    - assets/backgrounds/
