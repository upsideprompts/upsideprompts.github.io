<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tab Options — 3D Rectangle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div class="top-block">
      <div class="title-scene" aria-hidden="false">
        <div class="title-box" aria-label="UpsidePrompts Openclaw Mixtape">
          <div class="title-face title-front">UpsidePrompts : Openclaw Mixtape</div>
          <div class="title-face title-back"></div>
          <div class="title-face title-left"></div>
          <div class="title-face title-right"></div>
          <div class="title-face title-top"></div>
          <div class="title-face title-bottom"></div>
        </div>
      </div>

      <img
        class="page-icon"
        src="../ocstacks/screens/deskpic1.png"
        alt="Desk icon"
        width="96"
        height="96"
      />
    </div>

    <div class="viewport" id="viewport">
      <div class="box" id="box" aria-label="Rotatable translucent 3D rectangle">
        <div class="face front">
          <button
            class="surface-btn"
            type="button"
            data-url="https://upsideprompts.github.io/innovateav"
            aria-label="Open AutonomousCar Hub"
          >
            <span class="btn-face btn-front">AutonomousCar Hub</span>
            <span class="btn-face btn-back"></span>
            <span class="btn-face btn-left"></span>
            <span class="btn-face btn-right"></span>
            <span class="btn-face btn-top"></span>
            <span class="btn-face btn-bottom"></span>
          </button>

          <button
            class="surface-btn"
            type="button"
            data-url="https://upsideprompts.github.io/ocstacks"
            aria-label="Open Openclaw and Openrouter"
          >
            <span class="btn-face btn-front">Openclaw+Openrouter</span>
            <span class="btn-face btn-back"></span>
            <span class="btn-face btn-left"></span>
            <span class="btn-face btn-right"></span>
            <span class="btn-face btn-top"></span>
            <span class="btn-face btn-bottom"></span>
          </button>

          <button
            class="surface-btn"
            type="button"
            data-url="https://upsideprompts.github.io/topstockcombos"
            aria-label="Open AV ETF Dashboard"
          >
            <span class="btn-face btn-front">AV ETF Dashboard</span>
            <span class="btn-face btn-back"></span>
            <span class="btn-face btn-left"></span>
            <span class="btn-face btn-right"></span>
            <span class="btn-face btn-top"></span>
            <span class="btn-face btn-bottom"></span>
          </button>

          <button
            class="surface-btn"
            type="button"
            data-url="https://upsideprompts.github.io/pybites"
            aria-label="Open Python and Rap Trivia"
          >
            <span class="btn-face btn-front">Python+Rap Trivia</span>
            <span class="btn-face btn-back"></span>
            <span class="btn-face btn-left"></span>
            <span class="btn-face btn-right"></span>
            <span class="btn-face btn-top"></span>
            <span class="btn-face btn-bottom"></span>
          </button>
        </div>
        <div class="face back"></div>
        <div class="face left"></div>
        <div class="face right"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
