<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tab Options — 3D Rectangle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <img
      class="page-icon"
      src="../ocstacks/screens/deskpic1.png"
      alt="Desk icon"
      width="96"
      height="96"
    />
    <p class="hint">Drag to rotate · Tap a green button to open</p>

    <div class="viewport" id="viewport">
      <div class="box" id="box" aria-label="Rotatable translucent 3D rectangle">
        <div class="face front">
          <button
            class="surface-btn"
            type="button"
            data-url="https://upsideprompts.github.io/ocstacks"
            aria-label="Open OC Stacks"
          >
            <span class="btn-face btn-front">OC Stacks</span>
            <span class="btn-face btn-back"></span>
            <span class="btn-face btn-left"></span>
            <span class="btn-face btn-right"></span>
            <span class="btn-face btn-top"></span>
            <span class="btn-face btn-bottom"></span>
          </button>

          <button
            class="surface-btn"
            type="button"
            data-url="https://upsideprompts.github.io/pybites"
            aria-label="Open Py Bites"
          >
            <span class="btn-face btn-front">Py Bites</span>
            <span class="btn-face btn-back"></span>
            <span class="btn-face btn-left"></span>
            <span class="btn-face btn-right"></span>
            <span class="btn-face btn-top"></span>
            <span class="btn-face btn-bottom"></span>
          </button>
        </div>
        <div class="face back"></div>
        <div class="face left"></div>
        <div class="face right"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
